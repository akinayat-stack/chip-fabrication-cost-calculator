<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chip Fabrication Cost Calculator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --panel-2: #f9fbfc;
      --text: #1a1a1a;
      --muted: #666666;
      --accent: #2b87ff;
      --good: #27ae60;
      --bad: #e74c3c;
      --border: #d1d5db;
      --shadow: 0 10px 30px rgba(0, 0, 0, .08);
    }

    * { box-sizing: border-box; }
    body {
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
      color: var(--text);
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    h1 { margin: 0 0 1rem; font-size: 1.9rem; color: var(--text); }
    h2 { color: var(--text); margin-top: 0; }
    h3 { color: var(--text); margin-top: 1rem; }
    .subtitle { color: var(--muted); margin-bottom: 1rem; }
    .grid { display: grid; gap: 1rem; grid-template-columns: 340px 1fr; }
    .panel {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem;
      background: linear-gradient(145deg, var(--panel), var(--panel-2));
      box-shadow: var(--shadow);
    }
    label { display: block; font-size: .9rem; margin-top: .6rem; color: #333333; }
    input, select, button {
      width: 100%;
      padding: .6rem;
      margin-top: .3rem;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: var(--text);
    }
    input::placeholder, select { color: #999; }
    button {
      margin-top: .9rem;
      cursor: pointer;
      background: linear-gradient(135deg, #2b87ff, #1e6fd4);
      border: none;
      font-weight: 700;
      color: white;
    }
    button:hover { filter: brightness(0.94); box-shadow: 0 4px 12px rgba(43, 135, 255, 0.3); }

    #result {
      margin-top: .7rem;
      display: grid;
      gap: .6rem;
    }
    .metric {
      background: #f9fbfc;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: .55rem .7rem;
    }
    .metric .label { font-size: .8rem; color: #888888; }
    .metric .value { font-size: 1.05rem; font-weight: 700; margin-top: .2rem; color: var(--text); }

    .badge {
      display: inline-block;
      padding: .2rem .55rem;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 700;
      margin-left: .4rem;
    }
    .badge.good { background: #d4edda; color: #155724; }
    .badge.bad { background: #f8d7da; color: #721c24; }

    canvas { width: 100%; height: auto; border: 1px solid #d1d5db; border-radius: 12px; background: #ffffff; }
    .hint { color: var(--muted); font-size: .86rem; margin-top: .4rem; }
  </style>
</head>
<body>
  <h1><i class="fas fa-cog" style="margin-right: 0.5rem; color: var(--accent);"></i>Chip Fabrication Cost Calculator</h1>
  <div class="subtitle">Fast DPW + yield estimate with live wafer pass/fail simulation.</div>
  <div class="grid">
    <section class="panel">
      <h2>Inputs</h2>
      <label>Wafer Diameter (mm)<input id="waferDiameter" value="300" type="number"></label>
      <label>Die Area (mm²)<input id="dieArea" value="120" type="number"></label>
      <label>Defect Density (defects/cm²)<input id="defectDensity" value="0.2" step="0.01" type="number"></label>
      <label>Wafer Cost (USD)<input id="waferCost" value="17000" type="number"></label>
      <label>Yield Model
        <select id="yieldModel">
          <option value="murphy">Murphy</option>
          <option value="bose">Bose-Einstein</option>
        </select>
      </label>
      <button id="calcBtn"><i class="fas fa-rocket" style="margin-right: 0.4rem;"></i>Calculate</button>
      <h3>Output</h3>
      <div id="result">Run a calculation.</div>
    </section>

    <section class="panel">
      <h2>Interactive Wafer Visualization</h2>
      <canvas id="wafer" width="700" height="700"></canvas>
      <p class="hint">Green = good dies, red = failed dies based on calculated yield probability.</p>
    </section>
  </div>
  
<script src="./main.js"></script>
</body>
</html>
